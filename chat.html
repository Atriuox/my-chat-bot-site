<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with GPT</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
    #chatBox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
    input[type="text"] { width: 80%; padding: 10px; }
    button { padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>GPT Chatbot</h1>
  <div id="chatBox"></div>
  <input type="text" id="userInput" placeholder="Type your message here..." />
  <button onclick="sendMessage()">Send</button>

<script>
    async function sendMessage() {
        const userInput = document.getElementById("userInput").value;
        
        // Show loading or pending state
        document.getElementById("responseBox").innerText = "Bot is thinking...";

        // Fetch response from the Replit backend
        try {
            const response = await fetch("https://0a5f0be9-cbcd-4437-bfe6-b63333755393-00-3b55we6l2wboo.pike.replit.dev/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: userInput })
            });

            const data = await response.json();

            if (data.reply) {
                // Show response from the bot
                document.getElementById("responseBox").innerText = "Bot: " + data.reply;
            } else if (data.error) {
                document.getElementById("responseBox").innerText = "Error: " + data.error;
            } else {
                document.getElementById("responseBox").innerText = "Error: No reply from bot";
            }
        } catch (error) {
            document.getElementById("responseBox").innerText = "Error: " + error.message;
        }
    }
</script>
</body>
</html>
